<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' nexus-img: https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>Linkgeek</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar">
    <div class="brand">
      <img src="../assets/icon.png" alt="" />
      <span>Linkgeek</span>
      <div class="notif-wrap">
        <button class="notif-bell" id="notif-bell" title="Notifications" aria-label="Notifications"><svg class="bell-ic" viewBox="0 0 24 24"><path d="M12 2.6a1.4 1.4 0 0 1 1.4 1.4v.5a6.4 6.4 0 0 1 5 6.3v3.6l1.7 2.6a1 1 0 0 1-.8 1.6H4.7a1 1 0 0 1-.8-1.6l1.7-2.6v-3.6a6.4 6.4 0 0 1 5-6.3V4A1.4 1.4 0 0 1 12 2.6z"/><path d="M9.6 19.8h4.8a2.4 2.4 0 0 1-4.8 0z"/></svg><span class="notif-count" id="notif-count"></span></button>
        <div class="notif-panel" id="notif-panel" hidden></div>
      </div>
      <!-- Messagerie entre amis (renderer/chat-ui.js) -->
      <button class="notif-bell chat-btn" id="chat-btn" title="Messages" aria-label="Messages"><svg class="bell-ic" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z"/></svg><span class="notif-count" id="chat-count"></span></button>
      <!-- Mode TV / manette (renderer/tv.js) -->
      <button class="notif-bell tv-btn-top" id="tv-btn" data-tv-enter title="Mode TV / manette" aria-label="Mode TV / manette"><svg class="bell-ic" viewBox="0 0 24 24"><path d="M4.5 5h15A2.5 2.5 0 0 1 22 7.5v8a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 15.5v-8A2.5 2.5 0 0 1 4.5 5z"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      <!-- « Partager »: download link + parrainage (renderer/social-ui.js) -->
      <button class="notif-bell share-btn" id="share-btn" title="Partager Linkgeek" aria-label="Partager Linkgeek"><svg class="bell-ic" viewBox="0 0 24 24"><path d="M18 2.5a3.2 3.2 0 1 1-2.3 5.4l-6.4 3.4a3.3 3.3 0 0 1 0 1.4l6.4 3.4A3.2 3.2 0 1 1 14.8 18.5l-6.5-3.4a3.2 3.2 0 1 1 0-6.2l6.5-3.4A3.2 3.2 0 0 1 18 2.5z"/></svg></button>
      <!-- « Ne pas déranger » switch: sun (normal) on the left, moon (do not disturb) on the right -->
      <button class="dnd-switch dnd-moon" id="dnd-moon" role="switch" title="Ne pas déranger" aria-label="Ne pas déranger" aria-pressed="false" aria-checked="false"><span class="dnd-knob"></span><svg class="dnd-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="dnd-moon-ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="update-pill" id="update-pill" hidden></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Rechercher dans ta bibliothèque…  (Ctrl+K)" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <button class="profile" id="profile" data-nav="profile" title="Modifier mon profil"></button>
      <nav class="nav" id="nav">
        <button data-view="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
        <button data-view="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>Amis<span class="count" id="nav-friends"></span></button>
        <button data-view="challenges"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Défis<span class="count" id="nav-chal"></span></button>
        <button data-view="achievements"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 13v4M8 20h8M9 17h6"/></svg>Succès<span class="count" id="nav-ach"></span></button>
        <button data-view="shop"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.2 10.2a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg>Boutique<span class="count coins" id="nav-shop"></span></button>
        <button data-view="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="4" width="4" height="16" rx="1"/><path d="m15.5 5.2 3.9-1 3 15.5-3.9 1z"/></svg>Bibliothèque<span class="count" id="nav-count"></span></button>
        <button data-view="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistiques</button>
        <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Paramètres</button>
      </nav>
      <div class="side-title">Joués récemment</div>
      <div class="recents" id="recents"></div>
      <div class="side-footer">
        <button class="ghost" id="btn-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter un jeu</button>
        <button class="ghost icon-only" id="btn-rescan" title="Rescanner les bibliothèques"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
      </div>
    </aside>

    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="tv-root" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="i18n.js"></script>
  <script src="social-ui.js"></script>
  <script src="app.js"></script>
  <script src="chat-ui.js"></script>
  <script src="tv.js"></script>
</body>
</html>
